# WandB Sweep Configuration for PredatorPrey Hard — No DDCL Baseline
# Sweeps: seed x comm_coeff (lambda) only; channel=none means no quantization.
# 1 channel x 5 lambda x 3 seeds = 15 runs

program: sweep_wrapper.py
name: ddcl-sweep-pp-hard-none
method: grid
project: ddcl-applications
metric:
  name: win_rate
  goal: maximize

parameters:
  # Environment (medium difficulty)
  env_name:
    value: PredatorPrey
  scenario_name:
    value: hard
  algorithm_name:
    value: rmappo
  num_agents:
    value: 10
  num_env_steps:
    value: 3000000
  episode_length:
    value: 80
  dim:
    value: 20
  vision:
    value: 1
  n_rollout_threads:
    value: 15
  save_interval:
    value: 200
  log_interval:
    value: 400
  user_name:
    value: yashrb
  wandb_name:
    value: ddcl-applications

  # Network (same as hard)
  lr:
    value: 0.0001
  critic_lr:
    value: 0.0001
  entropy_coef:
    value: 0.001
  clip_param:
    value: 0.2
  n_block:
    value: 2
  n_embd:
    value: 64
  n_head:
    value: 4
  hidden_size:
    value: 64
  max_grad_norm:
    value: 10.0
  ppo_epoch:
    value: 10
  num_mini_batch:
    value: 1

  # No DDCL
  use_comms_channel:
    value: false

  # Swept parameters
  seed:
    values: [8, 12, 18]
  comm_coeff:
    values: [0.0001, 0.0004, 0.0007, 0.001, 0.004]
